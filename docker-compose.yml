services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - mindspace-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-engine:
    build:
      context: ./mindspace-ai-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres.tsxllljwpghkxidarjzj:jB8i2LguHDZ2%40sf@aws-1-ap-south-1.pooler.supabase.com:5432/postgres"
    networks:
      - mindspace-network
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  be:
    build:
      context: ./mindspace-be
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env.docker
    networks:
      - mindspace-network
    depends_on:
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  ingest:
    build:
      context: ./mindspace-ingest-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4001:4001"
    env_file:
      - .env.docker
    environment:
      PORT: "4001"
    networks:
      - mindspace-network
    depends_on:
      be:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  ui:
    build:
      context: ./mindspace-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "https://api.mindspaceai.online/api"
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - .env.docker
    environment:
      PORT: "3002"
    networks:
      - mindspace-network
    depends_on:
      be:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  mindspace-network:
    driver: bridge

volumes:
  redis_data:
